<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- YouTube necesita ver el origen de la página (Referer) o los videos fallan con error 152/153 -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Networking Lab</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2314b8a6'/><circle cx='16' cy='9' r='3.2' fill='white'/><circle cx='8' cy='22' r='3.2' fill='white'/><circle cx='24' cy='22' r='3.2' fill='white'/><path d='M16 9 8 22M16 9l8 13M8 22h16' stroke='white' stroke-width='1.8' fill='none'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script>
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Abrir menú">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="26" height="26"><rect width="32" height="32" rx="8" fill="var(--accent)"/><circle cx="16" cy="9" r="3.2" fill="#fff"/><circle cx="8" cy="22" r="3.2" fill="#fff"/><circle cx="24" cy="22" r="3.2" fill="#fff"/><path d="M16 9 8 22M16 9l8 13M8 22h16" stroke="#fff" stroke-width="1.8" fill="none"/></svg>
      </span>
      <span>Networking <span class="brand-sub">lab</span></span>
    </a>
    <div class="search" id="search">
      <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="searchInput" type="search" placeholder="Buscar en todo el repo…" autocomplete="off" spellcheck="false">
      <kbd class="search-kbd">/</kbd>
      <div class="search-results" id="searchResults" hidden></div>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Cambiar tema" title="Cambiar tema">
      <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
      <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="currentColor"/></svg>
    </button>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Archivos"></nav>
    <div class="scrim" id="scrim"></div>
    <main class="main" id="main">
      <div class="loading">Cargando…</div>
    </main>
    <aside class="toc" id="toc" aria-label="En esta página"></aside>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/powershell.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
